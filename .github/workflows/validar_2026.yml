# SAB: validação de 2026 contra referências independentes do ERA5 (IMERG e MODIS). Só leitura.
# Só lê o SAB_V1 (getInfo); não exporta nada nem grava no Drive.
# Roda sozinho quando a branch leitura-rs-impossivel é enviada ao GitHub, ou à mão (aba Actions).
name: Validar 2026 (IMERG e MODIS)

on:
  push:
    branches: [validacoes-extra]
    paths: [pesquisa/validar_2026_independente.py, .github/workflows/validar_2026.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt -r pesquisa/requirements.txt

      - name: Credencial do Earth Engine
        env:
          EE_CREDENCIAL: ${{ secrets.EE_CREDENCIAL }}
        run: |
          if [ -z "$EE_CREDENCIAL" ]; then echo "Falta o segredo EE_CREDENCIAL"; exit 1; fi
          mkdir -p ~/.config/earthengine
          printf '%s' "$EE_CREDENCIAL" > ~/.config/earthengine/credentials

      - name: Validação de 2026 no Earth Engine
        env:
          PYTHONUNBUFFERED: '1'
        run: python -W ignore pesquisa/validar_2026_independente.py

      - name: Apagar a credencial da máquina
        if: always()
        run: rm -f ~/.config/earthengine/credentials
