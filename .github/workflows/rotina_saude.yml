# ROTINA SEMANAL: toda segunda-feira, às 09h29 de Brasília, confere no SAB_V1 (só leitura) se o motor gravou nas
# últimas noites: dias de 2026 sem buraco, previsão até hoje + 10 dias, ERA5 com até 10 dias de atraso, o dia de hoje
# gravado há menos de 30 h, tudo na V1.6 e o histórico intocado. Resultado no rotinas/PAINEL.md.
name: Rotina - saude do banco

on:
  schedule:
    - cron: '29 12 * * 1'       # 09h29 de Brasília, toda segunda-feira
  push:
    branches: [rotinas-automaticas]
    paths: [rotinas/saude/**, rotinas/estado.py, .github/workflows/rotina_saude.yml]
  workflow_dispatch:

permissions:
  contents: write     # só para subir rotinas/ (resultados e painel de controle)

concurrency:
  group: rotinas-sab  # uma rotina de cada vez: todas escrevem no rotinas/PAINEL.md
  cancel-in-progress: false

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt -r pesquisa/requirements.txt

      - name: Credencial do Earth Engine
        env:
          EE_CREDENCIAL: ${{ secrets.EE_CREDENCIAL }}
        run: |
          if [ -z "$EE_CREDENCIAL" ]; then echo "Falta o segredo EE_CREDENCIAL"; exit 1; fi
          mkdir -p ~/.config/earthengine
          printf '%s' "$EE_CREDENCIAL" > ~/.config/earthengine/credentials

      - name: Saúde do banco
        env:
          PYTHONUNBUFFERED: '1'
        run: python -W ignore rotinas/saude/saude_semanal.py

      - name: Apagar a credencial da máquina
        if: always()
        run: rm -f ~/.config/earthengine/credentials

      - name: Subir os resultados e o painel de controle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rotinas
          if git diff --cached --quiet; then echo "Nada novo para subir."; exit 0; fi
          git commit -m "Rotina: saúde do banco ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
