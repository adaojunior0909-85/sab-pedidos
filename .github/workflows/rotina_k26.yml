# ROTINA MENSAL DA K26: todo dia 15, às 15h41 de Brasília, roda a K26 (sem mudança) só na rodada 1: 2026 inteiro, ~35
# min, SÓ LEITURA (a K26 trava a escrita no Earth Engine antes de começar). Guarda os CSV e o LOG em
# rotinas/resultados/k26_rodada1/<data>/ e escreve no rotinas/PAINEL.md os números, ao lado dos da execução anterior.
# [24/11] O motor agendado para 23h07 tem começado de manhã (06h40-09h20 de Brasília: o GitHub atrasa o agendamento);
# esta rotina roda à tarde, depois dele.
name: Rotina - K26 rodada 1 (2026)

on:
  schedule:
    - cron: '41 18 15 * *'      # 15h41 de Brasília, dia 15 (depois do motor, que tem rodado de manhã)
  push:
    branches: [rotinas-automaticas]
    paths: [rotinas/k26/**, .github/workflows/rotina_k26.yml]
  workflow_dispatch:
    inputs:
      rodada:
        description: 'Rodada da K26 (1 = 2026, a do painel; 5 a 12 = décadas do histórico)'
        required: false
        default: '1'

permissions:
  contents: write     # só para subir rotinas/ (resultados e painel de controle)

concurrency:
  group: rotina-k26
  cancel-in-progress: false

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt -r pesquisa/requirements.txt

      - name: Credencial do Earth Engine
        env:
          EE_CREDENCIAL: ${{ secrets.EE_CREDENCIAL }}
        run: |
          if [ -z "$EE_CREDENCIAL" ]; then echo "Falta o segredo EE_CREDENCIAL"; exit 1; fi
          mkdir -p ~/.config/earthengine
          printf '%s' "$EE_CREDENCIAL" > ~/.config/earthengine/credentials

      - name: K26, rodada 1
        env:
          PYTHONUNBUFFERED: '1'
          K26_RODADA: ${{ inputs.rodada || '1' }}
        run: python -W ignore rotinas/k26/rodar_rodada1.py

      - name: Apagar a credencial da máquina
        if: always()
        run: rm -f ~/.config/earthengine/credentials

      - name: Subir os resultados e o painel de controle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rotinas
          if git diff --cached --quiet; then echo "Nada novo para subir."; exit 0; fi
          git commit -m "Rotina: K26 rodada 1 ($(date -u +%Y-%m-%d))"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          # o painel é refeito dos estados de todas as rotinas (rotinas/estado/*.json): nunca perde a de outra rotina
          python rotinas/estado.py > /dev/null
          git add rotinas/PAINEL.md
          git diff --cached --quiet || git commit -q --amend --no-edit
          for i in 1 2 3 4; do git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((5 * i)); git pull --rebase -X theirs origin "$GITHUB_REF_NAME"; done
